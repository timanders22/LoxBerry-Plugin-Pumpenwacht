; Hilfetexte, english. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() flacht die Datei auf SEKTION.SCHLUESSEL ab und
; sucht sie in templates/lang/ - nicht neben der Hilfe. Deshalb
; heisst die Sektion [HILFE] und die Schluessel K01, K02, ...
; Bis 0.9.10 stand hier [HELP] mit HELP_TITEL; gesucht wurde
; HELP_TITEL, gefunden haette man nur HELP.HELP_TITEL - die Hilfe
; waere leer geblieben.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Pump guard"
K02 = "The pump guard watches a pump that has no data interface of its own by its <b>power draw</b>. The wattage of an intermediate meter arrives either through a virtual output from Loxone or — the shorter path — straight from the MQTT broker the meter is on anyway. From the course of that value the core derives findings. Pressure and flow are not measured."
K03 = "The model selection only enters <b>threshold values</b>; it changes nothing about the method. Stored are the Grundfos SCALA1 3-35 and 3-45 (data sheet, section 8). For any other pump use <i>free</i>, and then measure the numbers on your own installation — a threshold from someone else's data sheet is a guess, not a measurement."
K04 = "The <b>lock</b> is an output Loxone can put on the pump's socket — the plugin switches nothing by itself, and locking is off by default. A dry run destroys the shaft seal within minutes, which is why a lock that has been set stays until it is acknowledged. <b>For a pump that drains a sump or a cellar the lock does not belong on the socket</b>: a drainage pump that has been switched off is water damage, not protection. There it stays a display."
K05 = "A one-minute cycle carries the state forward even when nothing is being delivered, and sends four heartbeat topics. Without them a virtual input would keep its last value, and a failed meter would look like a quiet installation in the app."
K06 = "The findings"
K07 = "<b>Dry run</b> — the pump is running and draws <i>less</i> power than it would with water. A centrifugal pump moving air has nothing to accelerate; this is the one case where an unusually low number is the worse news."
K08 = "<b>Overload</b> — persistently more power than intended: a blocked impeller, a stiff bearing, the wrong mains voltage."
K09 = "<b>Continuous run</b> — the pump runs uninterrupted for longer than configured. On a domestic waterworks that points to a leak or an empty reservoir."
K10 = "<b>Rapid cycling</b> — too many starts per hour. The classic cause is a micro-leak or a diaphragm vessel without pre-charge."
K11 = "<b>No report</b> — no usable reading is available. That is expressly <i>not</i> the same as “the pump is off”: reporting zero here would present a failed meter as a quiet installation. Why none is available is spelled out in the <i>Settings</i> tab."
K12 = "Where things are"
K13 = "Every step, the ready-made templates for Loxone Config and a block list for rebuilding it 1:1 are in the <b>Loxone integration</b> tab. The <b>MQTT</b> tab carries the topics and the gateway state, the <b>Test</b> tab the self-check and the core self-test, the <b>Balance</b> tab the daily series, the maintenance counter and the measurement of whether the reading arrives cyclically."
