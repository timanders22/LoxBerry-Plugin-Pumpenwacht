[HELP]
HELP_TITEL = "Pump guard"
HELP_TEXT1 = "The pump guard monitors a pump (e.g. Grundfos SCALA1) without its own data interface: Loxone delivers the power draw of the metering plug, the calculation core derives findings (dry run, overload, continuous run, rapid cycling) and reports them back via MQTT."
HELP_TEXT2 = "The lock is an output that Loxone wires to the pump's socket — the plugin switches nothing by itself. A dry run destroys the shaft seal within minutes; the lock therefore persists until acknowledged (configurable)."
HELP_TEXT3 = "All steps including ready-made templates for Loxone Config are in the 'Loxone integration' tab. The 'Test' tab contains the self-test of the calculation core."
