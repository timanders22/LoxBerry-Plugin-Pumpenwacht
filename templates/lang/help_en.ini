[HELP]
HELP_TITEL = "Pump guard"
HELP_TEXT1 = "The pump guard monitors a pump (e.g. Grundfos SCALA1) without its own data interface by its power draw: Loxone delivers the wattage of the metering plug, the calculation core derives findings (dry run, overload, continuous run, rapid cycling, does not start) and reports them back via MQTT or HTTP. Pressure and flow are not measured."
HELP_TEXT2 = "The lock is an output that Loxone wires to the pump's socket — the plugin switches nothing by itself, and locking is off by default. A dry run destroys the shaft seal within minutes; the lock therefore persists until acknowledged (configurable)."
HELP_TEXT3 = "A one-minute cycle carries the state forward even when Loxone delivers nothing, and sends four heartbeat topics. Without them a virtual input would keep its last value, and a failed metering plug would look like a quiet system in the app."
HELP_TEXT4 = "All steps including ready-made templates for Loxone Config and a block list to rebuild 1:1 are in the 'Loxone integration' tab. The 'Test' tab contains the self-check and the self-test of the calculation core, the 'Statistics' tab the daily series, the maintenance counter and the measurement of whether your virtual output sends cyclically."
