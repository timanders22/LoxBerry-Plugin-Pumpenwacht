TEXT_HILFE = "Ein weiterer Meldeweg neben Loxone und SignalBot: Beginnt bei einer Pumpe ein Alarm, sagt das Plugin ihn über die gemeinsame Sprachausgabe der Plugins dieses Hauses an – Loxone Music Server, MusicServer4Home, eine eigene Adressvorlage, Alexa-NG oder Google-Lautsprecher (Chromecast 4 Lox NG). Angesagt wird nur der Beginn, höchstens einmal je Pumpe und Alarmart in 30 Minuten; Werte im Takt werden nie angesagt. Gesprochen wird im Minutentakt nach Loxone und SignalBot, unabhängig von beiden. Adresse und Vorlage müssen im Heimnetz liegen. Ab Werk aus."
L_ANLAESSE = "Anzusagende Alarme"
H_ANLAESSE = "Jede Alarmart lässt sich einzeln abwählen. Wirksam erst mit einer Ausgabeart unten."
TEXT = "Pumpenwächter: %1$s bei %2$s."
PRUEF = "Ansage bei Alarm (Sprachausgabe)"
K_TEST = "Testansage"
