[MQTT]
H_LEBENSZEICHEN = "Zusätzlich zu den Messwerten gehen vier Themen als <b>Lebenszeichen</b> hinaus: <span class='sm-mono'>status_ok</span>, <span class='sm-mono'>status_ts</span>, <span class='sm-mono'>status_zaehler</span> und <span class='sm-mono'>status_quelle_ts</span>. Sie gehen bei <b>jedem</b> Minutentakt hinaus, auch unverändert — ein virtueller Eingang behält seinen letzten Wert, und ohne Lebenszeichen sähe ein ausgefallenes Plugin in Loxone aus wie eine ruhige Anlage."
H_RETAIN = "<b>%d von %d Themen werden aufbewahrt (retain):</b> die Zustände <span class='sm-mono'>laeuft</span>, <span class='sm-mono'>befund</span>, <span class='sm-mono'>sperre</span>, <span class='sm-mono'>sperrgrund</span>, <span class='sm-mono'>quittung</span> und <span class='sm-mono'>quelle_online</span> – nach einem Neustart von Broker oder Gateway hat Loxone sie sofort. Messwerte, Tageswerte und das Lebenszeichen samt <span class='sm-mono'>status_ok</span> nie: ein aufbewahrtes „in Ordnung“ bliebe stehen, wenn das Plugin nicht mehr läuft. Ein Präfixwechsel und die Deinstallation räumen die aufbewahrten Themen im Broker ab."
H_THEMEN = "Veröffentlichte Themen"
