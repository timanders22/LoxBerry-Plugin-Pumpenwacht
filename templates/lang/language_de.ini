W_AUTOSTART = "Das MQTT-Gateway steht nicht auf Autostart (System → MQTT Gateway). Es wird gesendet, aber vermutlich hört niemand zu."
W_UNBEKANNT = "In <span class='sm-mono'>config/system/general.json</span> ist kein MQTT-Abschnitt zu finden. Entweder ist das Gateway nie eingerichtet worden, oder diese Datei ist nicht lesbar. Solange das so ist, wird nichts veröffentlicht — der HTTP-Weg im Reiter <i>Einbindung</i> funktioniert trotzdem."

[LOX]
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> ohne den Eintrag unten kommt am Miniserver nichts an — Die Zeile gehört unter <i>System &rarr; MQTT&nbsp;Gateway</i> in den Abschnitt <i>Subscriptions</i> (in einer deutschsprachigen Oberfläche <i>Abonnements</i>); danach speichern. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den <i>Subscriptions</i>, einzutragen ist nichts; dort werden nur die gewünschten Datenpunkte angehakt."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> &mdash; einzutragen ist hier nichts. In den <i>Subscriptions</i> (in einer deutschsprachigen Oberfläche <i>Abonnements</i>) erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht — dann hilft im Reiter <i>Test</i> der Knopf <i>Testwert anliefern</i>."
BEFUND_LEGENDE = "Befund: 0 = ok, 1 = Schaltspiel, 2 = Dauerlauf, 3 = Trockenlauf, 4 = Überlast, 5 = keine Meldung, 6 = läuft nicht an. Derselbe Schlüssel gilt für <span class='sm-mono'>sperrgrund</span>; dort heißt 0 „keine Sperre“."
BSP_EIN = "Eingänge verbinden mit"
BSP_NAME = "Name"
BSP_PARAM = "Parameter"
BSP_TYP = "Baustein (Typ)"
BSP_ZU1 = "<b>Zu 1 und 2 — beide optional:</b> Der Schwellwertschalter ist der einzige Baustein, der wirklich schaltet. Alles davor misst nur. Wer die Steckdose <b>nicht</b> automatisch abschalten will, lässt beide weg — dann bleibt die Sperre eine Anzeige, und das ist ein vollkommen sinnvoller Betrieb. <b>Bei einer Pumpe, die Wasser aus einem Schacht oder Keller fördert, ist das sogar der einzige sinnvolle Betrieb</b>: eine abgeschaltete Entwässerungspumpe ist ein Wasserschaden, kein Schutz."
BSP_ZU4 = "<b>Zu 4:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb gehört ein <i>Oder</i> davor und <b>niemals mehrere Quellen unmittelbar an seinen Eingang</b> — sonst verschluckt er jede Meldung, die kommt, während eine andere noch ansteht."
BSP_ZU6 = "<b>Zu 6 — der Baustein heißt wirklich so:</b> gesucht wird <i>Analogwertvalidierung</i>, nicht <i>Analogwertüberwachung</i>. Die zweite klingt richtiger und ist es nicht: sie überwacht einen <b>Wertebereich</b> (oberer und unterer Grenzwert) und merkt nie, dass sich ein Wert nicht mehr ändert. Die Analogwertvalidierung hat dafür den Parameter <i>Tmc</i>: der Eingangswert <b>muss</b> sich in diesem Intervall ändern, sonst geht ihr Ausgang <i>E</i> auf 1. <span class='sm-mono'>status_zaehler</span> läuft 0…999 um und ändert sich bei <b>jedem</b> Minutentakt — bleibt er stehen, arbeitet das Plugin nicht mehr, unabhängig davon, was die Messwerte daneben behaupten. Ein Zähler ist dafür verlässlicher als ein Zeitstempel: ein Raspberry ohne Echtzeituhr springt beim ersten Zeitabgleich, und ein Alter wäre danach negativ oder stundenlang, obwohl alles läuft."
BSP_ZU7 = "<b>Zu 7:</b> Dafür braucht es keinen Baustein. In Loxone Config lässt sich die Statistik unmittelbar am virtuellen Eingang anhaken — ein <i>Merker</i> oder <i>Analogspeicher</i> davor wäre überflüssig, und ein Analogspeicher hätte ohnehin nur <b>einen</b> Eingang, während hier zwei Werte aufzuzeichnen sind."
B1_EIN = "<span class='sm-mono'>sperre</span> → V"
B1_NAME = "Pumpe sperren"
B1_PARAM = "Ein 0,5 / Aus 0,5 (Werksvorgabe 0,5/0,2 tut dasselbe)"
B1_TYP = "Schwellwertschalter"
B2_EIN = "Ausgang von #1 → <b>Nicht</b> → Eingang des Relais- oder Steckdosenausgangs. Das <i>Nicht</i> ist Pflicht: #1 gibt 1 aus, <i>wenn gesperrt werden soll</i> — die Steckdose muss dann <b>aus</b>. Und niemals einen Pegel unmittelbar auf einen Baustein <i>Schalter</i> legen; der will Impulse."
B2_NAME = "Steckdose Pumpe"
