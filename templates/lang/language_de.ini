H_ART = "<b>Hauswasserwerk:</b> versorgt Verbraucher mit Druck. Ein Befund darf hier sperren — eine trocken laufende Pumpe zerstört ihre Gleitringdichtung in Minuten.<br><b>Entwässerungspumpe:</b> hält einen Schacht leer. Sie wird <b>nie</b> gesperrt, unabhängig von jedem Haken: eine gesperrte Sumpfpumpe bedeutet Wasser im Keller. Dafür meldet sie, wenn sie zu lange nicht mehr gelaufen ist."
