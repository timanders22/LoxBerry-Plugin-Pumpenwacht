SICH_ABGELEHNT = "Die Datei wurde <b>nicht</b> übernommen — es ist nichts geändert worden:"
SICH_ERKLAERUNG = "Für den <b>Umzug auf einen zweiten LoxBerry</b>: die Datei enthält alle Einstellungen dieses Plugins und lässt sich dort wieder einspielen. Beim Zurückspielen gilt: <b>was in der Datei nicht steht, bleibt unverändert</b> — es wird nichts auf den Werkswert zurückgesetzt, was Sie nicht genannt haben. Deshalb lässt sich auch eine Sicherung aus einer älteren Fassung einspielen."
SICH_FREMD = "Unbekannte Einstellung in der Datei: %s"
