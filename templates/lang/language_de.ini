[LOX]
ABO_GEMESSEN = "(gemessen: Gateway&nbsp;V%d)"
ABO_UNBEKANNT = "Welche Fassung Ihr MQTT&#8209;Gateway hat, ließ sich nicht feststellen. <b>Fassung&nbsp;1:</b> ohne den Eintrag unten kommt am Miniserver nichts an — Die Zeile gehört unter <i>System → MQTT&nbsp;Gateway</i> in den Abschnitt <i>Subscriptions</i> (in einer deutschsprachigen Oberfläche <i>Abonnements</i>); danach speichern. <b>Fassung&nbsp;2 und neuer:</b> die Themengruppe erscheint von selbst in den <i>Subscriptions</i>, einzutragen ist nichts; dort werden nur die gewünschten Datenpunkte angehakt."
ABO_V2 = "<b>MQTT&#8209;Gateway V2 erkennt die Themengruppe von selbst</b> — einzutragen ist hier nichts. In den <i>Subscriptions</i> (in einer deutschsprachigen Oberfläche <i>Abonnements</i>) erscheint die Gruppe; dort werden die gewünschten Datenpunkte einzeln angehakt. Erscheint sie nicht, hat noch nichts veröffentlicht — dann hilft im Reiter <i>Test</i> der Knopf <i>Testwert anliefern</i>."
BEFUND_LEGENDE = "Befund: 0 = ok, 1 = Schaltspiel, 2 = Dauerlauf, 3 = Trockenlauf, 4 = Überlast, 5 = keine Meldung, 6 = läuft nicht an, 7 = seit langem kein Lauf. Derselbe Schlüssel gilt für <span class='sm-mono'>sperrgrund</span>; dort heißt 0 „keine Sperre“."
BSP_EIN = "Eingänge verbinden mit"
BSP_NAME = "Name (Vorschlag)"
BSP_PARAM = "Parameter"
BSP_TYP = "Baustein (Typ)"
BS_E_NUR = "Ausgang von %s"
BSP_ZU1 = "<b>Zu #6, #7 und #21 — nur bei einem Hauswasserwerk:</b> Hier schaltet Loxone die Steckdose der Pumpe ab. Der Schwellwertschalter #6 macht aus der Sperre ein Schaltsignal, die Einschaltverzögerung #21 fängt seinen kurzen Impuls bei jeder Wertlieferung ab, und das <i>NICHT</i> #7 gibt die Steckdose frei, solange nicht gesperrt ist. Wer die Steckdose <b>nicht</b> automatisch abschalten will, lässt den Ausgang von #7 unbeschaltet — dann bleibt die Sperre eine Anzeige, und das ist ein vollkommen sinnvoller Betrieb. <b>Bei einer Pumpe, die Wasser aus einem Schacht oder Keller fördert, ist das sogar der einzige sinnvolle Betrieb</b>: eine abgeschaltete Entwässerungspumpe ist ein Wasserschaden, kein Schutz (das Plugin sperrt sie ohnehin nie)."
BSP_ZU4 = "<b>Zu #11, #24 bis #26 und #12:</b> eine Meldung für Sperre, jeden Befund und Ausfall. Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb gehören die zwei <i>ODER</i> davor und <b>niemals mehrere Quellen unmittelbar an seinen Eingang</b> — sonst verschluckt er jede Meldung, die kommt, während eine andere noch ansteht. Den Grund zeigen die Status „Befund als Text“ und „Pumpe Sperre“ in der App."
BSP_ZU6 = "<b>Zu %s — der Baustein heißt wirklich so:</b> gesucht wird <i>Analogwertvalidierung</i>, nicht <i>Analogwertüberwachung</i>. Die zweite klingt richtiger und ist es nicht: sie überwacht einen <b>Wertebereich</b> (oberer und unterer Grenzwert) und merkt nie, dass sich ein Wert nicht mehr ändert. Die Analogwertvalidierung hat dafür den Parameter <i>Tmc</i>: der Eingangswert <b>muss</b> sich in diesem Intervall ändern, sonst geht ihr Ausgang <i>E</i> auf 1. <span class='sm-mono'>status_zaehler</span> läuft 0…999 um und ändert sich bei <b>jedem</b> Minutentakt — bleibt er stehen, arbeitet das Plugin nicht mehr, unabhängig davon, was die Messwerte daneben behaupten. Ein Zähler ist dafür verlässlicher als ein Zeitstempel: ein Raspberry ohne Echtzeituhr springt beim ersten Zeitabgleich, und ein Alter wäre danach negativ oder stundenlang, obwohl alles läuft. Loxone Config beschriftet die Anschlüsse V, En, Tmc, Min, Max und am Ausgang E (in der Projektdatei inval, mintime, minval, maxval, error). Den Zähler an V legen, nicht an En; an En eine Konstante 1 (unbeschaltet steht En auf EIN). Config legt den Eingang En negiert an (Haken bei ‚En‘ im Eigenschaftsfenster unter Parameter). Diesen Haken entfernen, sonst kommt die Konstante 1 als 0 an und die Ausfallmeldung löst nie aus."
H = "Einbindung in Loxone – Schritt für Schritt"
H_VORLAGE = "Alles auf einmal anlegen"
H_VORLAGE_ADRESSE = "<b>Bitte die Adresse in der <i>Vorlage der Steuerbefehle</i> und in der <i>HTTP-Vorlage</i> prüfen.</b> Sie entsteht aus dem Namen, unter dem Sie diese Seite gerade aufgerufen haben. Steht dort <span class='sm-mono'>localhost</span> oder eine Adresse, die der Miniserver nicht erreicht, tragen Sie in Loxone Config die richtige ein — die Vorlage kann nicht wissen, wie der LoxBerry aus Sicht des Miniservers heißt."
H_VORLAGE_TEXT = "Statt jeden Eingang von Hand anzulegen. In Loxone Config zuerst im Baum links den Knoten anwählen — <b>Virtuelle Eingänge</b> beziehungsweise <b>Virtuelle Ausgänge</b> —, erst dann erscheint im Menüband der passende Knopf: <i>Vordefinierte HTTP-Geräte → Vorlage Importieren…</i> für die Eingänge, <i>Vordefinierte Geräte → Vorlage Importieren…</i> für die Ausgänge (dort ohne „HTTP“). <b>Achtung:</b> Loxone Config legt beim Import neu an und überschreibt nichts – zweimal eingelesen ergibt doppelte Bausteine."
K_VORLAGE_VI = "Vorlage der Eingänge (MQTT)"
K_VORLAGE_VI_TEXT = "Die MQTT-Vorlage ist eine <b>Abkürzung, kein Muss</b>: das Gateway legt die Eingänge beim ersten Empfang selbst an, und zwar als schlichte virtuelle Eingänge. Die Vorlage legt sie dagegen als <i>Virtuelle HTTP-Eingänge</i> mit der Attrappenadresse <span class='sm-mono'>http://localhost</span> und einem Abfragezyklus von 604800 s an — nur damit Loxone die richtig benannten Eingänge erzeugt; die Werte kommen weiterhin vom Gateway. <b>Diese eine Adresse bleibt absichtlich <span class='sm-mono'>localhost</span></b> und wird nicht geändert. Wer es einfach mag, lässt die Vorlage weg und wartet den ersten Empfang ab."
K_VORLAGE_VIHTTP = "Vorlage der Eingänge (HTTP)"
K_VORLAGE_VIHTTP_TEXT = "Die HTTP-Vorlage ist die <b>Alternative</b> zum MQTT-Weg: der Miniserver fragt den Endpunkt alle 30 s selbst ab, und es wird kein MQTT-Gateway gebraucht. Nehmen Sie <b>eine</b> der beiden Eingangs-Vorlagen, nicht beide — sonst stehen alle Werte doppelt im Projekt."
K_VORLAGE_VO = "Vorlage der Steuerbefehle"
S0_TEXT = "Es gibt <b>zwei Wege</b>, und Sie brauchen nur einen. <b>MQTT</b> ist der Regelweg: das Plugin schiebt jede Änderung sofort über das LoxBerry-MQTT-Gateway zum Miniserver. <b>HTTP</b> ist die Alternative ohne Gateway: der Miniserver fragt den Endpunkt zyklisch ab. Die Steuerbefehle (Schritte&nbsp;1, 4 und 5) sind bei beiden Wegen dieselben."
NUR_DIESE = "Alles auf diesem Reiter — Adressen, Feldnamen, das Abo — gilt für die oben gewählte Pumpe %s. Für eine andere Pumpe oben umschalten."
S0_TITEL = "Schritt 0: Den Weg festlegen"
S1_TAKT = "<b>Ein Sendetakt gehört davor.</b> Der Virtuelle Ausgang sendet nur bei Änderung, und einen Wert 0 wiederholt er nie (<i>Erste Wiederholung</i> wirkt nur bei einem Wert ungleich 0). Bleibt der Messwert länger aus als <i>Meldung veraltet nach</i> (ab Werk 180 s), gilt der Zustand als unbekannt — eine stehende Pumpe mit 0 W stünde nach 3 Minuten auf „keine Meldung“. Deshalb Impulsgeber 30/30 s und Formel <span class='sm-mono'>I1+I2/100</span> vor den Befehl legen (Zeilen #15 und #16 der Seite „Pumpenwacht“ in Schritt 7): die unsichtbare Änderung um 0,01 lässt Loxone spätestens alle 30 s senden. Ob es wirkt, misst der Reiter <i>Bilanz</i>: nach einigen Minuten steht dort „sendet zyklisch“."
S1_TEXT = "Ein <i>Virtueller Ausgang Befehl</i> (Analogwert = Leistung des Zwischenzählers) ruft:"
S1_TITEL = "Schritt 1: Messwert anliefern"
S2_TEXT = "<b>Ohne diesen Eintrag kommt am Miniserver nichts an.</b> Das ist die häufigste Fehlerursache überhaupt — und es gibt keine Fehlermeldung, die darauf hinweist. Die Zeile gehört unter <i>System → MQTT&nbsp;Gateway</i> in den Abschnitt <i>Subscriptions</i> (in einer deutschsprachigen Oberfläche <i>Abonnements</i>); danach speichern."
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S2_TITEL_UNBEKANNT = "Schritt 2: Das Abo im MQTT-Gateway"
S2_TITEL_V2 = "Schritt 2: Datenpunkte in den Abonnements anhaken"
S3_TEXT = "Beim MQTT-Weg legt das Gateway die Eingänge beim ersten Empfang selbst an, und die Vorlage weiter unten legt sie auf einmal mit den richtigen Namen an — <b>eines von beidem genügt</b>. Die Tabelle bleibt trotzdem stehen: sie erklärt, was da angelegt wird und was jeder Wert bedeutet. Die endgültigen Namen zeigt das Gateway unter <i>Eingehende Daten</i>. <b>Auf dem HTTP-Weg heißen dieselben Eingänge anders</b>: die HTTP-Vorlage legt sie mit dem Präfix <span class='sm-mono'>pw_</span> an, also <span class='sm-mono'>pw_watt</span> statt <span class='sm-mono'>%TOPIC%_watt</span>."
S3_TITEL = "Schritt 3: Virtuelle Eingänge"
S4_TEXT = "Ein <i>Virtueller Ausgang Befehl</i> (digital) hebt die Sperre nach Prüfung auf. Er steckt auch in der Vorlage der Steuerbefehle — wenn Sie die eingelesen haben, ist dieser Schritt schon erledigt:"
S4_TITEL = "Schritt 4: Sperre aus Loxone quittieren (optional)"
S5_TEXT = "<b>Nur wenn Loxone die Pumpe schaltet.</b> Läuft sie druckgesteuert von selbst — der Normalfall bei einer SCALA1 —, überspringen Sie diesen Schritt; die Anlaufüberwachung bleibt dann auf 0 und kostet nichts. Sonst: ein <i>Virtueller Ausgang Befehl</i> (digital) meldet Ein und Aus. Auch er steckt in der Vorlage der Steuerbefehle."
S5_TITEL = "Schritt 5: Anforderung melden (optional)"
S6_TEXT = "Ein virtueller Eingang <b>behält seinen letzten Wert</b>, wenn nichts mehr kommt. In der App sieht dann alles normal aus, während in Wahrheit seit Stunden nichts mehr gemessen wird. (Mit Retain veröffentlicht das Plugin nur <span class='sm-mono'>laeuft</span>, <span class='sm-mono'>befund</span>, <span class='sm-mono'>sperre</span>, <span class='sm-mono'>sperrgrund</span>, <span class='sm-mono'>quittung</span> und <span class='sm-mono'>quelle_online</span> — deren letzten Wert hält der Broker fest; das Lebenszeichen nie.) Dagegen gibt es <span class='sm-mono'>status_zaehler</span>: er läuft 0…999 um und ändert sich bei jedem Minutentakt. Bleibt er stehen, ist das ein Ausfall — verdrahtet wird das als Analogwertvalidierung #10 auf der Seite „Pumpenwacht“ in Schritt 7."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7_TEXT = "Zum 1:1-Nachbauen – zwei Seiten wie im LoxBerry-Plugins Musterprojekt: <b>„Pumpenwacht“</b> (Wächter, Sperre, Meldung und der Messwert aus Loxone) und <b>„Pumpenwacht Betrieb“</b> (Lauf, Tagesbilanz, Netz und Zähler). In Loxone Config finden Sie die Bausteine über <i>F5</i> (Bausteinsuche) unter genau dem genannten Typ. Die Namen der virtuellen Eingänge gelten für die gewählte Pumpe (über den HTTP-Weg ohne MQTT-Gateway tragen sie die Vorsilbe <span class='sm-mono'>pw_</span>). Die Nummern sind dieselben wie im Musterprojekt; ein Verweis wie #10 meint immer die Zeile derselben Seite."
S7_TITEL = "Schritt 7: Zwei Seiten mit allen Bausteinen"
S8_TEXT = "Im Reiter <i>Test</i> auf <i>Testwert anliefern</i> drücken (zum Beispiel 600) und dann in Loxone Config den virtuellen Eingang ansehen — auf dem MQTT-Weg heißt er <span class='sm-mono'>%TOPIC%_watt</span>, auf dem HTTP-Weg <span class='sm-mono'>pw_watt</span>. Dort muss die Zahl stehen. Steht sie nicht da, liegt es beim MQTT-Weg fast immer am fehlenden Abo (Schritt&nbsp;2), beim HTTP-Weg an der Adresse oder am Aktionstoken. Die Selbstprüfung im Reiter <i>Test</i> sagt, welches von beidem."
S8_TITEL = "Schritt 8: Gegenprobe"
SP_BEDEUTUNG = "Bedeutung"
SP_EINHEIT = "Einheit"
SP_TITEL = "Titel des virtuellen Eingangs"
VORLAGEN_MEHRERE = "Bei mehreren Pumpen: die <b>MQTT-Vorlage</b> und die <b>Ausgangs-Vorlage</b> enthalten <b>alle</b> Pumpen — sie werden einmal geholt und einmal eingelesen. Die <b>HTTP-Vorlage</b> dagegen fragt genau eine Adresse ab; sie muss <b>je Pumpe einmal</b> geholt werden (oben umschalten). Ihr Dateiname trägt dann die Kennung der Pumpe."
UNTERSTRICH = "Das Gateway macht aus dem Schrägstrich im Thema einen Unterstrich: aus <span class='sm-mono'>pumpe/watt</span> wird der Eingang <span class='sm-mono'>pumpe_watt</span>. Deshalb steht im Abo ein Schrägstrich und in der Tabelle ein Unterstrich."
