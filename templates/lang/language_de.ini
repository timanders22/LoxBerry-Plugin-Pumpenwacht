[GRUND]
WARUM = "Warum „unbekannt“?"
NIE_LOXONE = "Noch <b>kein einziger Messwert</b> eingegangen. Die Messwertquelle steht auf <b>Loxone</b> — den Watt-Wert liefert dort ein Virtueller Ausgang. Solange keiner eingerichtet ist, kann hier nichts stehen. Der Reiter <i>Einbindung in Loxone</i> führt durch die Einrichtung; wer den Zwischenzähler ohnehin am MQTT-Broker hat, stellt die Quelle stattdessen auf <b>MQTT</b> um. Mit dem Pumpenmodell hat das nichts zu tun — die Modellauswahl trägt nur Schwellenwerte ein."
NIE_THEMA = "Noch <b>kein einziger Messwert</b> eingegangen. Die Quelle steht auf MQTT, aber es ist <b>kein Quell-Thema eingetragen</b> — ohne Thema horcht niemand. Einzutragen im Reiter <i>Einstellungen</i>."
NIE_MOSQUITTO = "Noch <b>kein einziger Messwert</b> eingegangen. Die Quelle steht auf MQTT, aber <span class='sm-mono'>mosquitto_sub</span> fehlt auf diesem LoxBerry. Nachholen mit <span class='sm-mono'>sudo apt install mosquitto-clients</span>."
NIE_ZUHOERER = "Noch <b>kein einziger Messwert</b> eingegangen, und der <b>MQTT-Zuhörer läuft nicht</b>. Der Minutentakt holt ihn von selbst zurück — steht hier nach zwei Minuten immer noch dasselbe, sagt <span class='sm-mono'>php bin/pw_dienst.php --probe</span>, woran es liegt."
NIE_WARTEN = "Der MQTT-Zuhörer läuft und horcht auf <span class='sm-mono'>%s</span>, es ist nur <b>noch nichts angekommen</b>. Ein Shelly meldet sich zu jeder vollen Minute von selbst — bis zu 60 Sekunden Geduld sind hier normal."
ALT_LOXONE = "Seit <b>%s Sekunden</b> kein Messwert mehr. Der Virtuelle Ausgang in Loxone sendet nicht mehr — oder er sendet nur bei Änderung, und es hat sich nichts geändert. Welches von beidem, misst der Reiter <i>Bilanz</i>."
ALT_ABGEMELDET = "Seit <b>%s Sekunden</b> kein Messwert mehr, und der <b>Zwischenzähler hat sich beim Broker abgemeldet</b>. Das ist keine ruhende Pumpe — das ist ein Gerät ohne Strom oder ohne Funkverbindung."
ALT_ZUHOERER = "Seit <b>%s Sekunden</b> kein Messwert mehr, und der <b>MQTT-Zuhörer läuft nicht</b>. Der Minutentakt holt ihn von selbst zurück."
ALT_MQTT = "Seit <b>%s Sekunden</b> kein Messwert mehr. Der Zuhörer läuft und der Zwischenzähler ist angemeldet — es kommt nur nichts. Was ankommt, zeigt <span class='sm-mono'>php bin/pw_dienst.php --probe</span>."

