BSP_ZU1 = "<b>Zu %1$s bis %2$s — alle drei optional:</b> Der Schwellwertschalter ist der einzige Baustein, der wirklich schaltet. Alles davor misst nur. Wer die Steckdose <b>nicht</b> automatisch abschalten will, lässt alle drei weg — dann bleibt die Sperre eine Anzeige, und das ist ein vollkommen sinnvoller Betrieb. <b>Bei einer Pumpe, die Wasser aus einem Schacht oder Keller fördert, ist das sogar der einzige sinnvolle Betrieb</b>: eine abgeschaltete Entwässerungspumpe ist ein Wasserschaden, kein Schutz."
BSP_ZU4 = "<b>Zu %1$s und %2$s:</b> Der Benachrichtigungs-Baustein sendet nur beim Wechsel von Aus auf Ein. Deshalb gehört das <i>Oder</i> davor und <b>niemals mehrere Quellen unmittelbar an seinen Eingang</b> — sonst verschluckt er jede Meldung, die kommt, während eine andere noch ansteht."
BSP_ZU6 = "<b>Zu %s — der Baustein heißt wirklich so:</b> gesucht wird <i>Analogwertvalidierung</i>, nicht <i>Analogwertüberwachung</i>. Die zweite klingt richtiger und ist es nicht: sie überwacht einen <b>Wertebereich</b> (oberer und unterer Grenzwert) und merkt nie, dass sich ein Wert nicht mehr ändert. Die Analogwertvalidierung hat dafür den Parameter <i>Tmc</i>: der Eingangswert <b>muss</b> sich in diesem Intervall ändern, sonst geht ihr Ausgang <i>E</i> auf 1. <span class='sm-mono'>status_zaehler</span> läuft 0…999 um und ändert sich bei <b>jedem</b> Minutentakt — bleibt er stehen, arbeitet das Plugin nicht mehr, unabhängig davon, was die Messwerte daneben behaupten. Ein Zähler ist dafür verlässlicher als ein Zeitstempel: ein Raspberry ohne Echtzeituhr springt beim ersten Zeitabgleich, und ein Alter wäre danach negativ oder stundenlang, obwohl alles läuft."
BSP_ZU7 = "<b>Zu %s:</b> Dafür braucht es keinen Baustein. In Loxone Config lässt sich die Statistik unmittelbar am virtuellen Eingang anhaken — ein <i>Merker</i> oder <i>Analogspeicher</i> davor wäre überflüssig, und ein Analogspeicher hätte ohnehin nur <b>einen</b> Eingang, während hier zwei Werte aufzuzeichnen sind."
