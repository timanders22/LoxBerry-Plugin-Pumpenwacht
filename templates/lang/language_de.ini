W_UNBEKANNT = "In <span class='sm-mono'>config/system/general.json</span> ist kein MQTT-Abschnitt zu finden. Entweder ist das Gateway nie eingerichtet worden, oder diese Datei ist nicht lesbar. Solange das so ist, wird nichts veröffentlicht — der HTTP-Weg im Reiter <i>Einbindung</i> funktioniert trotzdem."
