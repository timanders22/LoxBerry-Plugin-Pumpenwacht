[BILANZ]
H_TAGE = "Die letzten Tage"
H_TAGE_TEXT = "Für eine Pumpe ist die Reihe über Wochen die eigentliche Auskunft: eine Laufzeit, die langsam steigt, ist ein Mikroleck; eine Startzahl, die steigt, ein wasserschlagendes Ventil. Aufbewahrt werden 60 Tage; ein Update löscht sie nicht."
H_TAKT = "Wie liefert Loxone an?"
H_TAKT_TEXT = "Gemessen, nicht geraten: die Abstände zwischen den letzten Anlieferungen. Ob Ihr virtueller Ausgang zyklisch oder nur bei Änderung sendet, steht in keiner Einstellung von Loxone Config — hier steht es."
