H_ART = "<b>Hauswasserwerk:</b> versorgt Verbraucher mit Druck. Ein Befund darf hier sperren — eine trocken laufende Pumpe zerstört ihre Gleitringdichtung in Minuten.<br><b>Entwässerungspumpe:</b> hält einen Schacht leer. Sie wird <b>nie</b> gesperrt, unabhängig von jedem Haken: eine gesperrte Sumpfpumpe bedeutet Wasser im Keller. Dafür meldet sie, wenn sie zu lange nicht mehr gelaufen ist."
H_NAME = "Steht in der Leiste über den Reitern und sonst nirgends — er geht in kein MQTT-Thema und in keine Adresse. Bleibt er leer, steht dort die Kennung."
H_PUMPE = "Diese Pumpe"
H_RUHT_S = "<b>0 = aus, und das ist die Vorgabe.</b> Eine Entwässerungspumpe, die lange nicht mehr gelaufen ist, ist verdächtig: ausgefallener FI, defekter Schwimmer, blockiertes Laufrad — man merkt es sonst erst, wenn der Keller voll ist. 172800 s sind 48 Stunden. Bei einem Hauswasserwerk ergibt der Wert selten Sinn: dort ist ein langer Stillstand der Normalfall (Urlaub)."
K_NEU = "Pumpe hinzufügen"
K_WEG = "Diese Pumpe entfernen"
