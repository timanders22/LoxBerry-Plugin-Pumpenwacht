BS_E_AKTOR = "Eingang des Relais- oder Steckdosenausgangs: %1$s. Das <i>Nicht</i> ist Pflicht: %2$s gibt 1 aus, <i>wenn gesperrt werden soll</i> — die Steckdose muss dann <b>aus</b>. Und niemals einen Pegel unmittelbar auf einen Baustein <i>Schalter</i> legen; der will Impulse."
