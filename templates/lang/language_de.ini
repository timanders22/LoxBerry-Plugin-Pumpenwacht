SICH_ABGELEHNT = "Die Datei wurde <b>nicht</b> übernommen — es ist nichts geändert worden:"
SICH_ERKLAERUNG = "Für den <b>Umzug auf einen zweiten LoxBerry</b>: die Datei enthält alle Einstellungen dieses Plugins und lässt sich dort wieder einspielen. Beim Zurückspielen gilt: <b>was in der Datei nicht steht, bleibt unverändert</b> — es wird nichts auf den Werkswert zurückgesetzt, was Sie nicht genannt haben. Deshalb lässt sich auch eine Sicherung aus einer älteren Fassung einspielen."
SICH_FREMD = "Unbekannte Einstellung in der Datei: %s"
SICH_FREMDES_PLUGIN = "Die Datei stammt aus einem anderen Plugin (%s)."
SICH_KEINE_DATEI = "Es wurde keine Datei ausgewählt oder der Upload ist fehlgeschlagen."
SICH_KEIN_JSON = "Die Datei ist keine gültige Sicherung dieses Plugins."
SICH_SCHREIBFEHLER = "Die Einstellungen ließen sich nicht schreiben."
SICH_UEBERNOMMEN = "Einstellungen zurückgespielt: %d von %d Werten übernommen."
SICH_WARNUNG = "<b>Die Datei enthält das Aktionstoken dieser Anlage.</b> Ohne es stünden nach dem Zurückspielen alle Felder richtig, und der Miniserver käme trotzdem nicht an das Plugin — deshalb ist es darin. Behandeln Sie die Datei wie ein Kennwort: nicht in ein Forum hängen und nicht an einen Fehlerbericht heften. Ist sie doch einmal aus der Hand gegangen, entwertet sie der Knopf <i>Neues Aktionstoken erzeugen</i> weiter unten."
SICH_WERT = "Unzulässiger Wert für %s: „%s“"
SICH_ZU_GROSS = "Die Datei ist größer als erlaubt — eine Sicherung dieses Plugins ist wenige Kilobyte groß."
SPERREN_ERKLAERUNG = "<b>Die Sperre schaltet nichts von selbst.</b> Sie ist ein Ausgang (<span class='sm-mono'>sperre</span>), den Loxone auf die Steckdose der Pumpe legt – ob und wie, entscheidet die Loxone-Logik. Ein Trockenlauf zerstört die Wellendichtung in Minuten; deshalb bleibt die Sperre bestehen, bis sie quittiert wird (einstellbar). <b>Ab Werk ist das Sperren aus</b> — der Wächter misst und meldet, bis Sie es einschalten."
TOKEN_NEU_ERZEUGT = "Neues Aktionstoken erzeugt. <b>Die bisherigen Adressen in Loxone funktionieren ab sofort nicht mehr</b> und müssen ersetzt werden — am einfachsten, indem Sie die Vorlage der Steuerbefehle neu erzeugen und in Loxone Config noch einmal einlesen."
TOKEN_TEXT = "Das Aktionstoken schützt den Endpunkt im unangemeldeten Bereich. Es steht offen in jeder Adresse, die Loxone aufruft — ohne es könnte jedes Gerät im Heimnetz Messwerte einliefern und damit eine Sperre aufheben."
TOKEN_WARNUNG = "Ein neues Token macht alle bisherigen Adressen in Loxone ungültig. Ein virtueller Ausgang wertet die Antwort nicht aus — der Ausfall wäre still. Erzeugen Sie eines nur, wenn die Sicherungsdatei aus der Hand gegangen ist, und lesen Sie danach die Vorlage neu ein."

SICH_LEER = "Die Datei enthält keine einzige bekannte Einstellung dieses Plugins."
SICH_LEER_GEHEIM = "Die Datei enthält für <span class='sm-mono'>%s</span> einen leeren Wert. Ein leeres Geheimnis würde die vorhandene Einstellung löschen und alle Adressen im Miniserver totlegen - der Wert wurde <b>nicht</b> übernommen, der bisherige bleibt stehen."
SICH_UNVERAENDERT = "%d Einstellung(en) standen nicht in der Datei und wurden <b>unverändert gelassen</b>: %s"
FEHLER_MUSTER = "%s: diese Eingabe ist so nicht zulässig."
H_QUELLE = "Woher kommt der Messwert?"
H_QUELLE_TEXT = "Es gibt <b>zwei Wege</b>, und Sie brauchen nur einen. <b>Über Loxone</b> ist die Vorgabe: ein Virtueller Ausgang liefert die Watt-Zahl an den Endpunkt. <b>Über MQTT</b> hört das Plugin den Zwischenzähler unmittelbar am Broker mit — dann entfällt der Umweg über den Miniserver, und Spannung, Strom und Frequenz kommen mit."
H_QUELLE_TOPIC = "Nur beim Weg über MQTT. Das Thema, auf das gehorcht wird — ein <span class='sm-mono'>#</span> am Ende ist erlaubt und meist richtig, dann kommen die Zustands- und die Anwesenheitsmeldung zusammen an. Für einen Shelly heißt es zum Beispiel <span class='sm-mono'>shelly1pmg4-Pumpensumpf/#</span>. Die Zugangsdaten des Brokers werden aus der Systemkonfiguration gelesen — Sie tragen hier keine ein, und die Sicherungsdatei enthält keine."
H_QUELLE_WAHL = "Ab Werk steht die Quelle auf <b>Loxone</b>. Eine Aktualisierung ändert damit nichts an einer laufenden Anlage."
L_QUELLE = "Messwertquelle"
L_QUELLE_TOPIC = "Quell-Thema (MQTT)"
Q_LOXONE = "Über Loxone (Virtueller Ausgang)"
Q_MQTT = "Über MQTT (direkt vom Zwischenzähler)"
W_KEIN_MOSQUITTO = "<b>Die Quelle steht auf MQTT, aber <span class='sm-mono'>mosquitto_sub</span> fehlt.</b> Ohne dieses Werkzeug kann das Plugin nicht mithören. Nachholen mit <span class='sm-mono'>sudo apt install mosquitto-clients</span> — oder die Quelle wieder auf Loxone stellen."
[MQTT]
H_LEBENSZEICHEN = "Zusätzlich zu den Messwerten gehen vier Themen als <b>Lebenszeichen</b> hinaus: <span class='sm-mono'>status_ok</span>, <span class='sm-mono'>status_ts</span>, <span class='sm-mono'>status_zaehler</span> und <span class='sm-mono'>status_quelle_ts</span>. Sie gehen bei <b>jedem</b> Minutentakt hinaus, auch unverändert — ein virtueller Eingang behält seinen letzten Wert, und ohne Lebenszeichen sähe ein ausgefallenes Plugin in Loxone aus wie eine ruhige Anlage."
H_RETAIN = "<b>%d von %d Themen werden aufbewahrt (retain).</b> Das Plugin schickt über den UDP-Eingang des Gateways ausschließlich <span class='sm-mono'>publish</span>. Nach einem Neustart des Brokers ist deshalb kein Wert da, bis der nächste Minutentakt ihn neu schreibt — das dauert höchstens eine Minute. Ein virtueller Eingang in Loxone behält seinen letzten Wert davon unberührt."
H_THEMEN = "Veröffentlichte Themen"
H_THEMEN_TEXT = "Alles, was das Plugin nach außen gibt — dieselbe Liste, die auch der Reiter <i>Einbindung in Loxone</i> zeigt, dort mit den Namen, die das Gateway daraus macht (Schrägstrich wird Unterstrich)."
SP_RETAIN = "aufbewahrt"
SP_THEMA = "Thema"
H_TOPIC = "Alle Werte werden unter diesem Präfix über das LoxBerry MQTT Gateway veröffentlicht. Gesendet wird nur, was sich geändert hat — das Lebenszeichen ausgenommen, das geht immer hinaus."
H_ZUSTAND = "Gateway-Zustand"
