H_AN_W = "Leistungsaufnahme am Zwischenzähler, ab der die Pumpe als laufend gilt. Der Standby der SCALA1 liegt bei etwa 1,5 W."
H_ANLAUF_S = "<b>0 = aus, und das ist die Vorgabe.</b> Diese Überwachung braucht ein Anforderungssignal aus Loxone (Schritt 5 im Reiter <i>Einbindung</i>). Läuft Ihre Pumpe druckgesteuert von selbst — der Normalfall bei einer SCALA1 —, gibt es kein solches Signal, und der Wert bleibt auf 0. Steht hier eine Zahl und Loxone meldet die Anforderung, gilt: nimmt die Pumpe nach so vielen Sekunden immer noch keine Leistung auf, ist der Befund „läuft nicht an“ — blockiertes Laufrad, defekter Kondensator, ausgefallener Schütz."
H_DAUERLAUF_S = "Ein Lauf ohne Ende deutet auf ein Leck oder einen offenen Verbraucher. Vorgabe 1800 s."
H_MODELL = "Pumpenmodell"
H_MODELL_TEXT = "Die Auswahl trägt Vorschlagswerte aus dem Datenblatt ein (Abschnitt 8, Montage- und Betriebsanleitung). Wer misst, trägt seine eigenen Zahlen ein – die Vorschläge überschreiben nur Trockenlauf-, Überlast- und Schaltspiel-Schwelle."
H_QUITTUNG = "So hält es die SCALA1 mit ihrem eigenen Alarm: ein Trockenlauf, der sich von selbst zurückstellt, wiederholt sich, bis die Dichtung hin ist. Ohne Haken gibt ein unauffälliger Messwert von selbst wieder frei — ein <b>ausgefallener</b> Zwischenzähler dagegen nie."
H_SCHWELLEN = "Schwellen"
H_SICHERUNG = "Einstellungen sichern und zurückspielen"
H_SPERREN = "Sperren"
H_STALE_S = "Kommt so lange kein Messwert an, gilt der Zustand als unbekannt – ein Ausfall des Zwischenzählers darf nie wie eine ruhende Anlage aussehen. Der Minutentakt meldet das auch dann nach Loxone, wenn gerade niemand hinsieht."
H_STARTS_H = "Der Hersteller erlaubt 25 Starts je Stunde – mehr deutet auf ein Mikroleck oder ein wasserschlagendes Ventil."
H_TOKEN = "Aktionstoken"
H_TROCKEN_S = "Beim Ansaugen ist die Leistung niedrig, ohne dass etwas kaputt wäre – der Anlaufaugenblick zählt deshalb nicht mit."
H_TROCKEN_W = "Eine Kreiselpumpe, die Luft fördert, nimmt WENIGER Leistung auf – eine ungewöhnlich niedrige Zahl ist hier die schlechte Nachricht."
H_UEBERLAST_W = "Dauerhaft zu hohe Aufnahme deutet auf Schwergang oder Blockade."
