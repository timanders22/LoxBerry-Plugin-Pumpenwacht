P1_SCHRITT1 = "Im Plugin, Reiter „Einstellungen“: „Art der Pumpe“ wählen (Hauswasserwerk oder Entwässerungspumpe), Modell oder eigene Schwellen eintragen und die „Messwertquelle“ festlegen – „Über Loxone (Virtueller Ausgang)“ (ab Werk; die Leistung kommt aus Ihrem Zähler über Loxone) oder „Über MQTT (direkt vom Zwischenzähler)“ (der Zähler hängt schon am Broker, z. B. ein Shelly). Bei einem Hauswasserwerk, das abgeschaltet werden darf, „Sperren einschalten“."
P1_SCHRITT2 = "Reiter „Einbindung in Loxone“, Abschnitt „Alles auf einmal anlegen“: die „Vorlage der Eingänge (MQTT)“ holen (ohne MQTT-Gateway die „Vorlage der Eingänge (HTTP)“ – dann heißen alle Eingänge pw_… statt %s) und die „Vorlage der Steuerbefehle“. In Loxone Config: Virtuelle Eingänge anwählen → Vordefinierte HTTP-Geräte → Vorlage importieren; Virtuelle Ausgänge anwählen → Vordefinierte Geräte → Vorlage importieren. Jede Vorlage nur einmal einlesen. Im Virtuellen Ausgang die Adresse prüfen (der Name des LoxBerry aus Sicht des Miniservers)."
P1_SCHRITT3 = "MQTT-Gateway Fassung 1: unter System → MQTT Gateway → Subscriptions „%s/#“ eintragen. Fassung 2: nur die Datenpunkte anhaken. Welche Fassung Sie haben, sagt Schritt 2 dieses Reiters."
P1_SCHRITT4 = "Im Baum anlegen: Virtueller Eingang „Leistung Pumpe (eigene Quelle)“ (nur bei Messwertquelle Loxone), Virtueller Eingang (Taste) „Taste Sperre quittieren“, Virtueller Eingang (Schalter) „Pumpe angefordert (eigene Quelle)“ (nur, wenn Loxone die Pumpe schaltet). Im eigenen Projekt statt „Leistung Pumpe (eigene Quelle)“ gleich die Leitung vom eigenen Zähler an #16 legen."
P1_SCHRITT5 = "Seite „Pumpenwacht“ anlegen, die genannten Eingänge und Befehle hineinziehen, die übrigen Bausteine über F5, Parameter wie in der Tabelle, von oben nach unten verbinden. Analogwertvalidierung #10: En an „Konstante 1“ (#18) und den Haken bei ‚En‘ im Eigenschaftsfenster entfernen – sonst kommt die 1 als 0 an und die Ausfallmeldung löst nie aus. Gesucht wird „Analogwertvalidierung“, nicht „Analogwertüberwachung“."
P1_SCHRITT6 = "Status „Befund als Text“ und „Pumpe Sperre“: die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt. Die Benachrichtigung „Pumpe meldet sich“ hat genau eine Leitung (von #26). Bei %1$s und %2$s im Eigenschaftsfenster „Statistik“ einschalten."
P1_SCHRITT7 = "Ausgang Q von „Steckdose freigeben“ (#7) an den Schaltaktor der Pumpensteckdose – nur bei einem Hauswasserwerk. Bei einer Entwässerungspumpe nicht: eine abgeschaltete Sumpfpumpe ist ein Wasserschaden (das Plugin sperrt sie ohnehin nie)."
P1_SCHRITT8 = "Speichern und in den Miniserver übertragen. Probe: im Plugin Reiter „Test“ auf „Testwert anliefern“ drücken (z. B. 600) – %s zeigt 600; im Reiter „Bilanz“ steht nach einigen Minuten „sendet zyklisch“ (der Sendetakt wirkt). Taste „Sperre quittieren“ in der App: das Protokoll des Plugins meldet „Sperre quittiert (Endpunkt).“"
P1_H1 = "Zu #15 bis #17: Ohne Sendetakt sendet Loxone bei stehender Pumpe (0 W) nichts; nach 3 Minuten meldet das Plugin „keine Meldung“. Der Sendetakt hält den Messwert frisch, auch bei 0 W – nur bei Messwertquelle Loxone; bei Quelle MQTT #8 und #15 bis #17 weglassen."
P1_H2 = "Schwellwertschalter geben bei jeder Wertlieferung einen kurzen Impuls ab; deshalb steht hinter #6 und #24 je eine Einschaltverzögerung von 5 s (#21, #25). Nicht weglassen – sonst schaltet die Steckdose jede Minute kurz ab."
P1_H3 = "Zu #19 und #20: nur, wenn Loxone die Pumpe schaltet und im Plugin „Anlauf überwachen nach“ über 0 s steht."
P1_H4 = "Mehrere Pumpen: im Plugin je Pumpe ein eigenes Topic-Präfix (z. B. sumpf); die MQTT- und die Steuer-Vorlage enthalten alle Pumpen, die Eingänge heißen dann sumpf_… und die Befehle „… - Name der Pumpe“. Die Seite je Pumpe einmal bauen."
P1_H5 = "Statuszeilen und Mitteilungstexte stehen in der Tabelle (Spalte Parameter) und werden von Hand eingetragen; ODER und UND haben je zwei Eingänge."
P1_H6 = "SignalBot und Ansage stellt man im Plugin ein; in Loxone ist dafür nichts anzulegen."
P2_SCHRITT1 = "Die Eingänge kommen aus derselben Vorlage wie auf der Seite „Pumpenwacht“ (dort Punkt 2) – nichts neu importieren."
P2_SCHRITT2 = "Neue Seite „Pumpenwacht Betrieb“ anlegen und die 17 Eingänge hineinziehen (%1$s, %2$s und %3$s ein weiteres Mal). Bei %4$s im Eigenschaftsfenster „Statistik“ einschalten."
P2_SCHRITT3 = "Benachrichtigung „Pumpe Unterspannung“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle."
P2_SCHRITT4 = "Übrige Bausteine über F5, Parameter wie in der Tabelle. An den Status „Pumpe Betrieb“ und „Pumpe Tagesbilanz“ je zweimal „+“ klicken (V5, V6), an „Pumpe Netz und Zähler“ einmal (V5)."
P2_SCHRITT5 = "Speichern und übertragen. Probe: „Pumpe Betrieb“ zeigt beim Lauf Sekunden und Watt wie der Reiter „Test“ des Plugins."
P2_H1 = "Spannung, Strom, Frequenz und die Anwesenheit des Zählers gibt es nur mit Messwertquelle MQTT; mit Quelle Loxone stehen sie auf -1, die Unterspannungsmeldung bleibt dann stumm (#22)."
P2_H2 = "„gestern“ ist erst nach dem ersten vollen Tag gefüllt (bis dahin -1)."
P2_H3 = "207/215 V sind Beispielschwellen (230 V minus 10 Prozent); nach dem eigenen Netz ändern."
P2_H4 = "Status-Eingänge ab V5 erscheinen erst nach Klick auf „+“ am Baustein; Statuszeilen und Mitteilungstext werden von Hand eingetragen; ein UND hat zwei Eingänge."
