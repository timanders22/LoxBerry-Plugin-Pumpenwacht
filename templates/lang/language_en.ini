BS_E_AKTOR = "input of the relay or socket output: %1$s. The <i>Not</i> is mandatory: %2$s outputs 1 <i>when the pump is to be locked</i> — the socket must then be <b>off</b>. And never feed a level straight into a <i>Switch</i> block; it wants pulses."
