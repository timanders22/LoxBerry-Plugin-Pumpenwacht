BSP_ZU1 = "<b>On %1$s to %2$s — all three optional:</b> The threshold switch is the only block that actually switches. Everything before it only measures. If you do <b>not</b> want the socket switched off automatically, leave all three out — the lock then remains a display, and that is a perfectly sensible way to run it. <b>For a pump that drains a sump or a cellar it is in fact the only sensible way</b>: a drainage pump that has been switched off is water damage, not protection."
BSP_ZU4 = "<b>On %1$s and %2$s:</b> The notification block only fires on the change from off to on. That is why the <i>Or</i> belongs in front of it and <b>never several sources directly on its input</b> — otherwise it swallows every message that arrives while another is still pending."
BSP_ZU6 = "<b>On %s — the block really is called that:</b> look for <i>Analogue value validation</i>, not <i>Analogue value monitoring</i>. The second one sounds more right and is not: it watches a <b>range</b> (upper and lower limit) and never notices that a value has stopped changing. Analogue value validation has the parameter <i>Tmc</i> for exactly that: the input value <b>must</b> change within this interval, otherwise its output <i>E</i> goes to 1. <span class='sm-mono'>status_zaehler</span> wraps around 0…999 and changes on <b>every</b> one-minute cycle — if it stops, the plugin has stopped working, regardless of what the readings next to it claim. A counter is more reliable here than a timestamp: a Raspberry without a real-time clock jumps at the first time sync, and an age would then be negative or hours long even though everything is fine."
BSP_ZU7 = "<b>On %s:</b> No block is needed for this. In Loxone Config statistics can be switched on directly at the virtual input — a <i>Memory</i> or <i>Analogue memory</i> in front would be superfluous, and an analogue memory would have only <b>one</b> input anyway, while two values are to be recorded here."
