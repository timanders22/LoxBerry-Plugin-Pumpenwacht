H_PUMPE = "This pump"
H_RUHT_S = "<b>0 = off, and that is the default.</b> A drainage pump that has not run for a long time is suspicious: tripped RCD, broken float switch, blocked impeller — otherwise you only notice when the basement is full. 172800 s is 48 hours. For a booster the value rarely makes sense: a long standstill is normal there (holidays)."
