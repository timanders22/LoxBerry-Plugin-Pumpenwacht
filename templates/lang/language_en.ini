[GRUND]
WARUM = "Why „unknown“?"
NIE_LOXONE = "Not a <b>single reading</b> has arrived yet. The reading source is set to <b>Loxone</b> — there the wattage comes from a virtual output. As long as none is set up, nothing can appear here. The tab <i>Loxone integration</i> walks through it; whoever already has the metering plug on the MQTT broker switches the source to <b>MQTT</b> instead. This has nothing to do with the pump model — the model selection only fills in thresholds."
NIE_THEMA = "Not a <b>single reading</b> has arrived yet. The source is set to MQTT, but <b>no source topic is entered</b> — without a topic nobody listens. Enter it on the <i>Settings</i> tab."
NIE_MOSQUITTO = "Not a <b>single reading</b> has arrived yet. The source is set to MQTT, but <span class='sm-mono'>mosquitto_sub</span> is missing on this LoxBerry. Install it with <span class='sm-mono'>sudo apt install mosquitto-clients</span>."
NIE_ZUHOERER = "Not a <b>single reading</b> has arrived yet, and the <b>MQTT listener is not running</b>. The minute tick brings it back by itself — if this still says the same after two minutes, <span class='sm-mono'>php bin/pw_dienst.php --probe</span> says why."
NIE_WARTEN = "The MQTT listener is running and listening on <span class='sm-mono'>%s</span>, <b>nothing has arrived yet</b>. A Shelly reports on every full minute by itself — up to 60 seconds of patience are normal here."
ALT_LOXONE = "No reading for <b>%s seconds</b>. The virtual output in Loxone has stopped sending — or it only sends on change and nothing has changed. Which of the two it is, the <i>Balance</i> tab measures."
ALT_ABGEMELDET = "No reading for <b>%s seconds</b>, and the <b>metering plug has signed off from the broker</b>. That is not a resting pump — that is a device without power or without a radio link."
ALT_ZUHOERER = "No reading for <b>%s seconds</b>, and the <b>MQTT listener is not running</b>. The minute tick brings it back by itself."
ALT_MQTT = "No reading for <b>%s seconds</b>. The listener is running and the metering plug is signed on — nothing simply arrives. What does arrive is shown by <span class='sm-mono'>php bin/pw_dienst.php --probe</span>."

