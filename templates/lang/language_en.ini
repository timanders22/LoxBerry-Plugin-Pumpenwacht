[LOX]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_UNBEKANNT = "The version of your MQTT&#8209;gateway could not be determined. <b>Version&nbsp;1:</b> without the entry below nothing arrives at the Miniserver — The line goes under <i>System → MQTT&nbsp;Gateway</i> into the <i>Subscriptions</i> section; then save. <b>Version&nbsp;2 and newer:</b> the topic group appears in the <i>Subscriptions</i> by itself, nothing is to be entered; there you only tick the data points you want."
ABO_V2 = "<b>MQTT&#8209;gateway V2 recognises the topic group by itself</b> — nothing is to be entered here. The group appears in the <i>Subscriptions</i>; there you tick the data points you want one by one. If it does not appear, nothing has published yet — then the <i>Deliver test value</i> button in the <i>Test</i> tab helps."
BEFUND_LEGENDE = "Finding: 0 = ok, 1 = rapid cycling, 2 = continuous run, 3 = dry run, 4 = overload, 5 = no report, 6 = does not start, 7 = no run for a long time. The same key applies to <span class='sm-mono'>sperrgrund</span>; there 0 means “no lock”."
