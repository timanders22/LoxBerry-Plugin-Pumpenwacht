SICH_ABGELEHNT = "The file was <b>not</b> accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there. On restore: <b>whatever is not in the file stays unchanged</b> — nothing you did not name is reset to its factory value. That is also why a backup from an older version can be restored."
SICH_FREMD = "Unknown setting in the file: %s"
SICH_FREMDES_PLUGIN = "The file comes from a different plugin (%s)."
SICH_KEINE_DATEI = "No file was selected, or the upload failed."
SICH_KEIN_JSON = "The file is not a valid backup of this plugin."
SICH_SCHREIBFEHLER = "The settings could not be written."
SICH_UEBERNOMMEN = "Settings restored: %d of %d values taken over."
SICH_WARNUNG = "<b>The file contains this system's action token.</b> Without it every field would be right after a restore and the Miniserver still would not reach the plugin — that is why it is in there. Treat the file like a password: do not post it in a forum and do not attach it to a bug report. If it has left your hands, the <i>Create a new action token</i> button below invalidates it."
SICH_WERT = "Invalid value for %s: „%s“"
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SPERREN_ERKLAERUNG = "<b>The lock does not switch anything by itself.</b> It is an output (<span class='sm-mono'>sperre</span>) that Loxone wires to the pump's socket – whether and how is up to the Loxone logic. A dry run destroys the shaft seal within minutes; the lock therefore persists until acknowledged (configurable). <b>Locking is off by default</b> — the guard measures and reports until you switch it on."
TOKEN_NEU_ERZEUGT = "New action token created. <b>The previous addresses in Loxone stop working immediately</b> and must be replaced — most easily by creating the control-command template again and importing it into Loxone Config once more."
TOKEN_TEXT = "The action token protects the endpoint in the unauthenticated area. It appears openly in every address Loxone calls — without it, any device on the home network could deliver readings and thereby release a lock."
TOKEN_WARNUNG = "A new token invalidates every existing address in Loxone. A virtual output does not evaluate the answer — the failure would be silent. Only create one if the backup file has left your hands, and re-import the template afterwards."

SICH_LEER = "The file contains not a single known setting of this plugin."
SICH_LEER_GEHEIM = "The file contains an empty value for <span class='sm-mono'>%s</span>. An empty secret would delete the existing setting and kill every address in the Miniserver - the value was <b>not</b> applied, the previous one remains."
SICH_UNVERAENDERT = "%d setting(s) were not in the file and have been <b>left unchanged</b>: %s"
FEHLER_MUSTER = "%s: this entry is not permitted in that form."
H_QUELLE = "Where does the reading come from?"
H_QUELLE_TEXT = "There are <b>two paths</b>, and you only need one. <b>Via Loxone</b> is the default: a virtual output delivers the wattage to the endpoint. <b>Via MQTT</b> the plugin listens to the metering plug directly on the broker — the detour through the Miniserver falls away, and voltage, current and frequency come along."
H_QUELLE_TOPIC = "Only for the MQTT path. The topic to listen on — a trailing <span class='sm-mono'>#</span> is allowed and usually right, so that status and presence messages arrive together. For a Shelly it reads for example <span class='sm-mono'>shelly1pmg4-Pumpensumpf/#</span>. The broker credentials are read from the system configuration — you enter none here, and the backup file contains none."
H_QUELLE_WAHL = "The source defaults to <b>Loxone</b>. An update therefore changes nothing on a running system."
L_QUELLE = "Reading source"
L_QUELLE_TOPIC = "Source topic (MQTT)"
Q_LOXONE = "Via Loxone (virtual output)"
Q_MQTT = "Via MQTT (straight from the metering plug)"
W_KEIN_MOSQUITTO = "<b>The source is set to MQTT, but <span class='sm-mono'>mosquitto_sub</span> is missing.</b> Without that tool the plugin cannot listen. Install it with <span class='sm-mono'>sudo apt install mosquitto-clients</span> — or set the source back to Loxone."
[MQTT]
H_LEBENSZEICHEN = "In addition to the readings, four topics go out as a <b>heartbeat</b>: <span class='sm-mono'>status_ok</span>, <span class='sm-mono'>status_ts</span>, <span class='sm-mono'>status_zaehler</span> and <span class='sm-mono'>status_quelle_ts</span>. They go out on <b>every</b> one-minute cycle, even unchanged — a virtual input keeps its last value, and without a heartbeat a dead plugin would look like a quiet system in Loxone."
H_RETAIN = "<b>%d of %d topics are retained.</b> The plugin sends only <span class='sm-mono'>publish</span> through the gateway's UDP input. After a restart of the broker no value is present until the next one-minute cycle writes it again — at most one minute. A virtual input in Loxone keeps its last value regardless."
H_THEMEN = "Published topics"
H_THEMEN_TEXT = "Everything the plugin sends out — the same list the <i>Loxone integration</i> tab shows, there with the names the gateway makes of them (slash becomes underscore)."
SP_RETAIN = "retained"
SP_THEMA = "Topic"
H_TOPIC = "All values are published under this prefix via the LoxBerry MQTT Gateway. Only what has changed is sent — except the heartbeat, which always goes out."
H_ZUSTAND = "Gateway state"
