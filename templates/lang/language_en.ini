; Pump guard - English interface texts
; Anyone adding a finding to the core (pw_regel.php) must add it here and in
; the German file under [BEFUND] - the core header requires it.
; Attributes in markup use SINGLE quotes (class='sm-mono'); a straight double
; quote breaks parse_ini_file.

