H_ART = "<b>Booster:</b> supplies consumers with pressure. A finding may lock it — a pump running dry destroys its mechanical seal within minutes.<br><b>Drainage pump:</b> keeps a sump empty. It is <b>never</b> locked, regardless of any checkbox: a locked sump pump means water in the basement. Instead it reports when it has not run for too long."
