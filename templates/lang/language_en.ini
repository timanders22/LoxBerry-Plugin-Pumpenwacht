W_UNBEKANNT = "No MQTT section can be found in <span class='sm-mono'>config/system/general.json</span>. Either the gateway was never set up, or this file is not readable. While that is the case nothing is published — the HTTP path in the <i>Integration</i> tab still works."

[LOX]
ABO_GEMESSEN = "(measured: gateway&nbsp;V%d)"
ABO_UNBEKANNT = "The version of your MQTT&#8209;gateway could not be determined. <b>Version&nbsp;1:</b> without the entry below nothing arrives at the Miniserver. <b>Version&nbsp;2 and newer:</b> the topic group appears by itself in the <i>Subscriptions</i>, nothing has to be entered."
ABO_V2 = "<b>MQTT&#8209;gateway V2 detects the topic group by itself</b> &mdash; nothing has to be entered here. The group appears in the <i>Subscriptions</i>; the desired data points are ticked there individually. If it does not appear, nothing has been published yet — the <i>Deliver test value</i> button in the <i>Test</i> tab helps."
BEFUND_LEGENDE = "Finding: 0 = ok, 1 = rapid cycling, 2 = continuous run, 3 = dry run, 4 = overload, 5 = no report, 6 = does not start. The same key applies to <span class='sm-mono'>sperrgrund</span>; there 0 means „no lock“."
BSP_EIN = "Connect inputs to"
BSP_NAME = "Name"
BSP_PARAM = "Parameters"
BSP_TYP = "Block (type)"
BSP_ZU1 = "<b>On 1 and 2 — both optional:</b> The threshold switch is the only block that actually switches. Everything before it only measures. If you do <b>not</b> want the socket switched off automatically, leave both out — the lock then remains a display, and that is a perfectly sensible way to run it. <b>For a pump that drains a sump or a cellar it is in fact the only sensible way</b>: a drainage pump that has been switched off is water damage, not protection."
BSP_ZU4 = "<b>On 4:</b> The notification block only fires on the change from off to on. That is why an <i>Or</i> belongs in front of it and <b>never several sources directly on its input</b> — otherwise it swallows every message that arrives while another is still pending."
BSP_ZU6 = "<b>On 6 — the block really is called that:</b> look for <i>Analogue value validation</i>, not <i>Analogue value monitoring</i>. The second one sounds more right and is not: it watches a <b>range</b> (upper and lower limit) and never notices that a value has stopped changing. Analogue value validation has the parameter <i>Tmc</i> for exactly that: the input value <b>must</b> change within this interval, otherwise its output <i>E</i> goes to 1. <span class='sm-mono'>status_zaehler</span> wraps around 0…999 and changes on <b>every</b> one-minute cycle — if it stops, the plugin has stopped working, regardless of what the readings next to it claim. A counter is more reliable here than a timestamp: a Raspberry without a real-time clock jumps at the first time sync, and an age would then be negative or hours long even though everything is fine."
BSP_ZU7 = "<b>On 7:</b> No block is needed for this. In Loxone Config statistics can be switched on directly at the virtual input — a <i>Memory</i> or <i>Analogue memory</i> in front would be superfluous, and an analogue memory would have only <b>one</b> input anyway, while two values are to be recorded here."
B1_EIN = "<span class='sm-mono'>sperre</span> → V"
B1_NAME = "Lock pump"
B1_PARAM = "On 0.5 / off 0.5 (the factory default 0.5/0.2 does the same)"
B1_TYP = "Threshold switch"
B2_EIN = "Output of #1 → <b>Not</b> → input of the relay or socket output. The <i>Not</i> is mandatory: #1 outputs 1 <i>when the pump is to be locked</i> — the socket must then be <b>off</b>. And never feed a level straight into a <i>Switch</i> block; it wants pulses."
B2_NAME = "Pump socket"
B2_PARAM = "—"
B2_TYP = "Actuator output (not a logic block)"
B3_EIN = "<span class='sm-mono'>befund</span> → I1"
B3_NAME = "Finding as text"
B3_PARAM = "0 = ok, 1 = rapid cycling, 2 = continuous run, 3 = dry run, 4 = overload, 5 = no report, 6 = does not start"
B3_TYP = "Status"
B4_EIN = "<span class='sm-mono'>sperre</span> and output <i>E</i> of #6 → <b>Or</b> → input"
B4_NAME = "Pump reports in"
B4_PARAM = "Text from #3 as the message"
B4_TYP = "Notification"
B5_EIN = "Output → virtual output <i>Acknowledge lock</i>"
B5_NAME = "Acknowledge lock"
B5_PARAM = "The default pulse length (0.3 s) is enough"
B5_TYP = "Push button"
B6_EIN = "<span class='sm-mono'>status_zaehler</span> → V; output <b>E</b> (error) is the failure signal"
B6_NAME = "Pump guard has failed"
B6_PARAM = "Tmc = 300 (minimum change interval), Min = 0, Max = 999"
B6_TYP = "Analogue value validation"
B7_EIN = "nothing to wire: switch on statistics for <span class='sm-mono'>lauf_s_tag</span> and <span class='sm-mono'>starts_tag</span>"
B7_NAME = "Record running time and starts"
B7_PARAM = "in the input's property window under <i>Statistics</i>"
B7_TYP = "not a block — statistics on the input"
H = "Loxone integration – step by step"
H_VORLAGE = "Create everything at once"
H_VORLAGE_ADRESSE = "<b>Please check the address in the <i>template for the control commands</i> and in the <i>HTTP template</i>.</b> It is built from the name under which you opened this page. If it says <span class='sm-mono'>localhost</span> or an address the Miniserver cannot reach, enter the correct one in Loxone Config — the template cannot know what the LoxBerry is called from the Miniserver's point of view."
H_VORLAGE_TEXT = "Instead of creating every input by hand. In Loxone Config first select the node in the tree on the left — <b>Virtual inputs</b> or <b>Virtual outputs</b> — only then does the matching button appear in the ribbon: <i>Predefined HTTP devices → Import template…</i> for the inputs, <i>Predefined devices → Import template…</i> for the outputs (without “HTTP” there). <b>Careful:</b> Loxone Config creates new objects on import and overwrites nothing – importing twice produces duplicate blocks."
K_VORLAGE_VI = "Template for the inputs (MQTT)"
K_VORLAGE_VI_TEXT = "The MQTT template is a <b>shortcut, not a requirement</b>: the gateway creates the inputs itself on first receipt, as plain virtual inputs. The template instead creates them as <i>virtual HTTP inputs</i> with the dummy address <span class='sm-mono'>http://localhost</span> and a polling cycle of 604800 s — only so that Loxone creates the correctly named inputs; the values still come from the gateway. <b>This one address deliberately stays <span class='sm-mono'>localhost</span></b> and is not changed. If you prefer it simple, skip the template and wait for the first message."
K_VORLAGE_VIHTTP = "Template for the inputs (HTTP)"
K_VORLAGE_VIHTTP_TEXT = "The HTTP template is the <b>alternative</b> to the MQTT path: the Miniserver polls the endpoint itself every 30 s, and no MQTT gateway is needed. Use <b>one</b> of the two input templates, not both — otherwise every value appears twice in the project."
K_VORLAGE_VO = "Template for the control commands"
S0_TEXT = "There are <b>two paths</b>, and you only need one. <b>MQTT</b> is the standard path: the plugin pushes every change to the Miniserver via the LoxBerry MQTT gateway immediately. <b>HTTP</b> is the alternative without a gateway: the Miniserver polls the endpoint cyclically. The control commands (steps&nbsp;1, 4 and 5) are the same on both paths."
S0_TITEL = "Step 0: Choose the path"
S1_TAKT = "<b>Please send cyclically, not only on change</b> — about every 30 s. You do not have to guess whether your virtual output does that: the <i>Statistics</i> tab measures the actual interval between deliveries and tells you. And if it does only send on change: the plugin's one-minute cycle carries the state forward anyway, it just takes up to a minute longer."
S1_TEXT = "A <i>virtual output command</i> (analogue value = power of the metering plug) calls:"
S1_TITEL = "Step 1: Deliver the reading"
S2_TEXT = "Enter under <i>System → MQTT Gateway → Subscriptions</i>: <b>Without this entry nothing arrives at the Miniserver.</b>"
S2_TITEL = "Step 2: Enter the subscription in the MQTT gateway"
S2_TITEL_V2 = "Step 2: Tick the data points in the Subscriptions"
S3_TEXT = "On the MQTT path the gateway creates the inputs itself on first receipt, and the template below creates them all at once with the right names — <b>either one is enough</b>. The table stays regardless: it explains what is being created and what each value means. The gateway shows the final names under <i>Incoming data</i>. <b>On the HTTP path the same inputs are named differently</b>: the HTTP template creates them with the prefix <span class='sm-mono'>pw_</span>, so <span class='sm-mono'>pw_watt</span> instead of <span class='sm-mono'>%TOPIC%_watt</span>."
S3_TITEL = "Step 3: Virtual inputs"
S4_TEXT = "A <i>virtual output command</i> (digital) releases the lock after inspection. It is also part of the control-command template — if you imported that, this step is already done:"
S4_TITEL = "Step 4: Acknowledge the lock from Loxone (optional)"
S5_TEXT = "<b>Only if Loxone switches the pump.</b> If it runs on pressure control by itself — the normal case for a SCALA1 — skip this step; the start-up check then stays at 0 and costs nothing. Otherwise: a <i>virtual output command</i> (digital) reports on and off. It is also part of the control-command template."
S5_TITEL = "Step 5: Report the demand (optional)"
S6_TEXT = "A virtual input <b>keeps its last value</b> when nothing arrives any more. Everything then looks normal in the app while in truth nothing has been measured for hours. (This plugin publishes <b>without</b> retain — after a restart of the broker the topics are gone until the next one-minute cycle writes them again.) That is what <span class='sm-mono'>status_zaehler</span> is for: it wraps around 0…999 and changes on every one-minute cycle. If it stops, that is a failure — wired as block #6 in the list below."
S6_TITEL = "Step 6: Failure detection"
S7_TEXT = "To rebuild 1:1. In Loxone Config you find the blocks via <i>F5</i> (block search) under exactly the name given here — the names have been checked against the Loxone block directory. Rows 2 and 7 are not blocks but a hardware output and a property; they are listed for completeness."
S7_TITEL = "Step 7: The blocks"
S8_TEXT = "In the <i>Test</i> tab press <i>Deliver test value</i> (600, for example) and then look at the virtual input in Loxone Config — on the MQTT path it is called <span class='sm-mono'>%TOPIC%_watt</span>, on the HTTP path <span class='sm-mono'>pw_watt</span>. The number must be there. If it is not, on the MQTT path it is almost always the missing subscription (step&nbsp;2), on the HTTP path the address or the action token. The self-check in the <i>Test</i> tab says which of the two."
S8_TITEL = "Step 8: Cross-check"
