[EINST]
FEHLER_BEREICH = "%s: allowed is %s to %s."
FEHLER_SPEICHERN = "The configuration could not be saved: %s"
FEHLER_ZAHL = "%s: please enter a number."
H_AN_W = "Power draw at the metering plug from which the pump counts as running. The SCALA1 idles at about 1.5 W."
H_ANLAUF_S = "<b>0 = off, and that is the default.</b> This check needs a demand signal from Loxone (step 5 in the <i>Integration</i> tab). If your pump runs on pressure control by itself — the normal case for a SCALA1 — there is no such signal and this stays at 0. With a number here and a demand reported by Loxone: if the pump still draws no power after that many seconds, the finding is „does not start“ — blocked impeller, failed capacitor, failed contactor."
H_DAUERLAUF_S = "A run without end points to a leak or an open consumer. Default 1800 s."
H_MODELL = "Pump model"
H_MODELL_TEXT = "The selection fills in suggested values from the data sheet (section 8 of the installation and operating instructions). Anyone who measures enters their own figures – the suggestions only overwrite the dry-run, overload and cycling thresholds."
H_QUITTUNG = "This is how the SCALA1 handles its own alarm: a dry run that resets itself repeats until the seal is ruined. Without the tick, an unremarkable reading releases the lock by itself — a <b>failed</b> meter never does."
H_SCHWELLEN = "Thresholds"
H_SICHERUNG = "Back up and restore settings"
H_SPERREN = "Locking"
H_STALE_S = "If no reading arrives for this long, the state counts as unknown – a failed metering plug must never look like a quiet system. Default 180 s, three times the one-minute cycle: after that <span class='sm-mono'>status_ok=0</span>, <span class='sm-mono'>laeuft=-1</span> and <span class='sm-mono'>befund=5</span> go to Loxone, repeated in every cycle – even when nobody is looking. A gap in the readings does not restart the deadlines for “not running at all” and “running too long”."
H_STARTS_H = "The manufacturer allows 25 starts per hour – more points to a micro-leak or a water-hammering valve."
H_TOKEN = "Action token"
H_TROCKEN_S = "While priming, power draw is low without anything being wrong – the start-up moment therefore does not count."
H_TROCKEN_W = "A centrifugal pump moving air draws LESS power – an unusually low figure is the bad news here."
H_UEBERLAST_W = "Persistently high draw points to stiffness or a blockage."
