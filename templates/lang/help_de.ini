; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() flacht die Datei auf SEKTION.SCHLUESSEL ab und
; sucht sie in templates/lang/ - nicht neben der Hilfe. Deshalb
; heisst die Sektion [HILFE] und die Schluessel K01, K02, ...
; Bis 0.9.10 stand hier [HELP] mit HELP_TITEL; gesucht wurde
; HELP_TITEL, gefunden haette man nur HELP.HELP_TITEL - die Hilfe
; waere leer geblieben.
; Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Pumpenwächter"
K02 = "Der Pumpenwächter überwacht eine Pumpe ohne eigene Datenschnittstelle an ihrer <b>Leistungsaufnahme</b>. Die Watt-Zahl eines Zwischenzählers kommt entweder über einen Virtuellen Ausgang aus Loxone oder — der kürzere Weg — unmittelbar vom MQTT-Broker, an dem der Zähler ohnehin hängt. Aus dem Verlauf stellt der Rechenkern Befunde. Druck und Durchfluss werden nicht gemessen."
K03 = "Die Modellauswahl trägt nur <b>Schwellenwerte</b> ein; sie ändert nichts am Verfahren. Hinterlegt sind die Grundfos SCALA1 3-35 und 3-45 (Datenblatt, Abschnitt 8). Für jede andere Pumpe gilt <i>frei</i>, und dann sind die Zahlen an der eigenen Anlage zu messen — eine Schwelle aus einem fremden Datenblatt ist eine Vermutung, kein Messwert."
K04 = "Die <b>Sperre</b> ist ein Ausgang, den Loxone auf die Steckdose der Pumpe legen kann — das Plugin schaltet nichts von selbst, und ab Werk ist das Sperren aus. Ein Trockenlauf zerstört die Wellendichtung in Minuten; deshalb bleibt eine gesetzte Sperre bestehen, bis sie quittiert wird. <b>Bei einer Pumpe, die einen Schacht oder Keller entwässert, gehört die Sperre nicht auf die Steckdose</b>: eine abgeschaltete Entwässerungspumpe ist ein Wasserschaden, kein Schutz. Dort bleibt sie eine Anzeige."
K05 = "Ein Minutentakt schreibt den Zustand auch dann fort, wenn gerade nichts angeliefert wird, und schickt vier Lebenszeichen-Themen. Ohne sie behielte ein virtueller Eingang seinen letzten Wert, und ein ausgefallener Zwischenzähler sähe in der App aus wie eine ruhende Anlage."
K06 = "Die Befunde"
K07 = "<b>Trockenlauf</b> — die Pumpe läuft und nimmt dabei <i>weniger</i> Leistung auf als im Betrieb mit Wasser. Eine Kreiselpumpe, die Luft fördert, muss nichts beschleunigen; das ist der eine Fall, in dem eine ungewöhnlich niedrige Zahl die schlimmere Nachricht ist."
K08 = "<b>Überlast</b> — dauerhaft mehr Leistung als vorgesehen: blockiertes Laufrad, schwergängiges Lager, falsche Netzspannung."
K09 = "<b>Dauerlauf</b> — die Pumpe läuft länger ununterbrochen als eingestellt. Bei einem Hauswasserwerk deutet das auf ein Leck oder einen leeren Vorratsbehälter."
K10 = "<b>Schaltspiel</b> — zu viele Starts je Stunde. Der klassische Grund ist ein Mikroleck oder ein Membranspeicher ohne Vordruck."
K11 = "<b>keine Meldung</b> — es liegt kein brauchbarer Messwert vor. Das ist ausdrücklich <i>nicht</i> dasselbe wie „die Pumpe steht“: wer hier null meldete, würde einen ausgefallenen Zähler als ruhige Anlage darstellen. Warum keiner vorliegt, sagt der Reiter <i>Einstellungen</i> in eigenen Worten."
K12 = "Wo was steht"
K13 = "Alle Schritte samt fertiger Vorlagen für Loxone Config und einer Baustein-Liste zum 1:1-Nachbauen stehen im Reiter <b>Einbindung in Loxone</b>. Der Reiter <b>MQTT</b> trägt die Themen und den Zustand des Gateways, der Reiter <b>Test</b> die Selbstprüfung und den Selbsttest des Rechenkerns, der Reiter <b>Bilanz</b> die Tagesreihe, den Wartungszähler und die Messung, ob der Messwert zyklisch ankommt."
