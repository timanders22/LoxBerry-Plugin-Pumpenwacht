[HELP]
HELP_TITEL = "Pumpenwächter"
HELP_TEXT1 = "Der Pumpenwächter überwacht eine Pumpe (z. B. Grundfos SCALA1) ohne eigene Datenschnittstelle: Loxone liefert die Leistungsaufnahme des Zwischenzählers an, der Rechenkern stellt daraus Befunde (Trockenlauf, Überlast, Dauerlauf, Schaltspiel) und meldet sie per MQTT zurück."
HELP_TEXT2 = "Die Sperre ist ein Ausgang, den Loxone auf die Steckdose der Pumpe legt — das Plugin schaltet nichts von selbst. Ein Trockenlauf zerstört die Wellendichtung in Minuten; deshalb bleibt die Sperre bestehen, bis sie quittiert wird (einstellbar)."
HELP_TEXT3 = "Alle Schritte samt fertiger Vorlagen für Loxone Config stehen im Reiter „Einbindung in Loxone". Der Reiter „Test" enthält den Selbsttest des Rechenkerns."
