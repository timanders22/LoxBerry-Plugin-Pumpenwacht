[HELP]
HELP_TITEL = "Pumpenwächter"
HELP_TEXT1 = "Der Pumpenwächter überwacht eine Pumpe (z. B. Grundfos SCALA1) ohne eigene Datenschnittstelle an ihrer Leistungsaufnahme: Loxone liefert die Watt-Zahl des Zwischenzählers an, der Rechenkern stellt daraus Befunde (Trockenlauf, Überlast, Dauerlauf, Schaltspiel, läuft nicht an) und meldet sie über MQTT oder HTTP zurück. Druck und Durchfluss werden nicht gemessen."
HELP_TEXT2 = "Die Sperre ist ein Ausgang, den Loxone auf die Steckdose der Pumpe legt — das Plugin schaltet nichts von selbst, und ab Werk ist das Sperren aus. Ein Trockenlauf zerstört die Wellendichtung in Minuten; deshalb bleibt die Sperre bestehen, bis sie quittiert wird (einstellbar)."
HELP_TEXT3 = "Ein Minutentakt schreibt den Zustand auch dann fort, wenn Loxone gerade nichts anliefert, und schickt vier Lebenszeichen-Themen. Ohne sie behielte ein virtueller Eingang seinen letzten Wert, und ein ausgefallener Zwischenzähler sähe in der App aus wie eine ruhende Anlage."
HELP_TEXT4 = "Alle Schritte samt fertiger Vorlagen für Loxone Config und einer Baustein-Liste zum 1:1-Nachbauen stehen im Reiter „Einbindung in Loxone“. Der Reiter „Test“ enthält die Selbstprüfung und den Selbsttest des Rechenkerns, der Reiter „Bilanz“ die Tagesreihe, den Wartungszähler und die Messung, ob Ihr virtueller Ausgang zyklisch sendet."
